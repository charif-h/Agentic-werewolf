[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "realmodel: needs a running Ollama server with the model installed (skipped unless --run-realmodel is given)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", "loup_env", "venv"]

[tool.ruff.lint]
# Syntax errors, undefined names, unused imports and variables, and a few common bug patterns
select = ["E4", "E7", "E9", "F", "B006", "B008", "B015", "B018"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/__init__.py", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
